# Route notification sound streams through a dedicated virtual sink.
# The topbar's Focus Mode mutes this sink without affecting music, calls, or
# other normal desktop audio.

# Activate the role-loopback component in WirePlumber's default profile.
wireplumber.profiles = {
  main = {
    policy.linking.role-based.loopbacks = required
  }
}

# Supply the shared properties for our role loopback sink.
wireplumber.components.rules = [
  {
    matches = [
      {
        provides = "~loopback.sink.*"
      }
    ]
    actions = {
      merge = {
        arguments = {
          capture.props = {
            policy.role-based.target = true
            audio.position = [ FL, FR ]
            media.class = Audio/Sink
          }
          playback.props = {
            node.passive = true
            # Avoid chaining the loopback into another role sink.
            media.role = "Loopback"
          }
        }
        requires = [ support.client-context ]
      }
    }
  }
]

# Create only the Notification role sink from WirePlumber's role-loopback
# policy. Its exposed node is `input.loopback.sink.role.notification`.
wireplumber.components = [
  {
    type = virtual
    provides = policy.linking.role-based.loopbacks
    requires = [ loopback.sink.role.notification ]
  }
  {
    name = libpipewire-module-loopback
    type = pw-module-client
    arguments = {
      node.name = "loopback.sink.role.notification"
      node.description = "System Notifications"
      capture.props = {
        # Electron uses `event` for message sounds; native applications
        # generally use Notification or Alert.
        device.intended-roles = [ "Notification", "event", "Event", "alert", "Alert" ]
        policy.role-based.priority = 20
        policy.role-based.action.same-priority = "mix"
        policy.role-based.action.lower-priority = "mix"
      }
    }
    provides = loopback.sink.role.notification
  }
]
